site_name: Website Ingestion Pipeline
site_url: https://purvik-31.github.io/website-crawler/
site_description: A modular web crawling and data extraction pipeline.
repo_url: https://github.com/PURVIK-31/website-crawler
repo_name: PURVIK-31/website-crawler

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI Reference: cli-reference.md
  - API Reference: api-reference.md
  - Output Format: output-format.md
  - Architecture: architecture.md
  - Deployment: deployment.md
  - Knowledge Invariants: invariants.md
  - Architecture Decisions:
    - Overview: adr/index.md
    - ADR-0001 Record architecture decisions: adr/0001-record-architecture-decisions.md
    - ADR-0002 Parquet canonical, LanceDB derived: adr/0002-parquet-canonical-lancedb-derived.md
    - ADR-0003 Single-node v2 scope: adr/0003-single-node-v2-scope.md
    - ADR-0004 Ephemeral jobs, durable assets: adr/0004-ephemeral-jobs-durable-assets.md

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - def_list
  - toc:
      permalink: true
